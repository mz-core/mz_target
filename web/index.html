<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mz_target</title>
    <link rel="stylesheet" href="style.css?v=20260424menu" />
  </head>
  <body>
    <div id="target-wrapper" class="is-hidden" aria-hidden="true">
      <div id="target-eye" class="target-eye">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path
            d="M6 32C10.8 22.4 19.9 16 32 16C44.1 16 53.2 22.4 58 32C53.2 41.6 44.1 48 32 48C19.9 48 10.8 41.6 6 32Z"
            stroke="currentColor"
            stroke-width="5"
            stroke-linejoin="round"
          />
          <circle cx="32" cy="32" r="9" fill="currentColor" />
        </svg>
      </div>

      <div id="target-status-card" class="target-status-card is-hidden">
        <div id="target-status-label" class="target-status-label">Interagir</div>
        <div id="target-status-hint" class="target-status-hint">
          Botao direito para abrir menu
        </div>
      </div>

      <section id="target-menu" class="target-menu is-hidden" aria-hidden="true">
        <header class="target-menu-header">
          <div class="target-menu-kicker">Target</div>
          <div id="target-menu-title" class="target-menu-title">Interagir</div>
          <div id="target-menu-hint" class="target-menu-hint">
            Mouse liberado. Escolha uma opcao.
          </div>
        </header>

        <div id="target-options" class="target-options"></div>

        <footer class="target-menu-footer">
          <span>ESC fecha</span>
          <span>Botao direito volta</span>
        </footer>
      </section>
    </div>

    <template id="target-option-template">
      <button type="button" class="target-option">
        <span class="target-option-badge"></span>
        <span class="target-option-copy">
          <span class="target-option-label"></span>
          <span class="target-option-description"></span>
        </span>
      </button>
    </template>

    <script src="app.js?v=20260424menu"></script>
  </body>
</html>
